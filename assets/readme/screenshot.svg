<text x="32" y="152" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#8fb8ff">▌ </tspan><tspan fill="#a9a7b8">how do I squash my last three commits before pushing? @notes.md</tspan></text>
<text x="32" y="196" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#f3ece3">Rebase interactively onto the commit before them and mark the last two</tspan></text>
<text x="32" y="218" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#f3ece3">as </tspan><tspan fill="#c7dbff">squash</tspan><tspan fill="#f3ece3">:</tspan></text>
<rect x="24" y="246" width="932" height="28" fill="#2a2a3c"/>
<text x="40" y="265" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#f3ece3">git rebase -i HEAD~3</tspan></text>
<text x="32" y="312" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#f3ece3">Change </tspan><tspan fill="#c7dbff">pick</tspan><tspan fill="#f3ece3"> to </tspan><tspan fill="#c7dbff">squash</tspan><tspan fill="#f3ece3"> on lines 2 and 3, save, then edit the combined</tspan></text>
<text x="32" y="334" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#f3ece3">message. Push with </tspan><tspan fill="#c7dbff">--force-with-lease</tspan><tspan fill="#f3ece3"> if the branch was already published.</tspan></text>
<text x="32" y="378" xml:space="preserve" text-anchor="start" font-family="'IBM Plex Mono','JetBrains Mono',Menlo,'DejaVu Sans Mono',ui-monospace,monospace" font-size="14"><tspan fill="#8fb8ff" font-weight="700">## Before you do it</tspan></text>
